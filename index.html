<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Online C++ Compiler</title>
<style>
:root{color-scheme:dark;--bg:#2b2724;--bar:#8a99a6;--side:#2a5d86;--tab:#6f8ea9;--gutter:#34302d;--text:#e8e0d0;--green:#7fc241;--cm:#e0b060;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);font-family:Segoe UI,Arial,sans-serif;color:var(--text)}
#app{display:flex;height:100%}
#side{width:55px;background:linear-gradient(#2a5d86,#1b3f5c);padding:8px;flex:none}
#logo{width:38px;height:38px;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:20px}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#toolbar{background:var(--bar);display:flex;align-items:center;gap:6px;padding:7px 12px;flex-wrap:wrap}
.btn{border:0;color:#fff;font-size:12px;padding:6px 12px;cursor:pointer;border-radius:2px;background:#5b7a92}
.run{background:#5aa045}.stop{background:#b0504a}.share{background:#d98a3a}.save{background:#5b7a92}.dl{background:#3b9aa5}
.btn:disabled{opacity:.5;cursor:default}
.spacer{flex:1}
select{background:transparent;color:#fff;border:0;font-size:15px;padding:4px}
select option{color:#000}
.sq{background:#d9a35a;width:32px;height:30px;border:0;color:#fff;border-radius:2px}
#tabs{background:#7f93a4;height:30px}
#tab{display:inline-block;background:var(--tab);color:#fff;padding:5px 6px;font-size:15px;height:100%}
#editor{flex:1;display:flex;min-height:80px;position:relative;overflow:hidden}
#nums{background:var(--gutter);color:#aaa;font:14px/20.5px Consolas,monospace;text-align:right;padding:6px 8px 6px 14px;width:58px;overflow:hidden;white-space:pre;user-select:none}
#prompt{flex:1;background:transparent;border:0;outline:0;resize:none;color:var(--text);font:italic 14px/20.5px Consolas,monospace;padding:6px 10px;white-space:pre-wrap;overflow:auto}
#prompt::placeholder{color:var(--cm);opacity:.9}
#bar{background:#7f8c93;height:26px;display:flex;align-items:center;padding:0 8px;gap:14px;font-size:13px;color:#fff}
#bar .t{flex:1;text-align:center}
#out{height:38%;min-height:120px;background:#252220;overflow:auto;padding:8px 6px;font:15px/1.4 Consolas,monospace}
#out pre{margin:0;white-space:pre-wrap;word-break:break-word;font:inherit}
.ok{color:var(--green);font-weight:bold}.err{color:#ff7b72;font-weight:bold}
.cur{display:inline-block;width:10px;height:18px;border:1px solid #ccc;vertical-align:middle}
@media(max-width:600px){#side{display:none}.btn{padding:6px 8px}}
</style>
</head>
<body>
<div id="app">
 <div id="side"><div id="logo">⚡</div></div>
 <div id="main">
  <div id="toolbar">
   <button class="btn run" id="run">▶ Run</button>
   <button class="btn" id="debug">⊙ Debug</button>
   <button class="btn stop" id="stop">■ Stop</button>
   <button class="btn share" id="share">Share</button>
   <button class="btn save" id="save">Save</button>
   <button class="btn" id="beauty">{ } Beautify</button>
   <button class="btn dl" id="copy">⧉ Copy code</button>
   <span class="spacer"></span>
   <span style="font-size:15px">Language</span>
   <select id="lang"><option>C++</option><option>C</option><option>Python</option><option>Java</option><option>JavaScript</option><option>C#</option></select>
   <button class="sq" title="Info">i</button><button class="sq" title="Settings">⚙</button>
  </div>
  <div id="tabs"><span id="tab">prompt.txt</span></div>
  <div id="editor">
   <div id="nums">1</div>
   <textarea id="prompt" spellcheck="false" placeholder="/********************************************************
   AI Online C++ Compiler.
   Describe your problem here instead of writing code,
   then press the “Run” button: the AI writes the solution.
********************************************************/

Example: Read n and print the sum of the first n numbers."></textarea>
  </div>
  <div id="bar"><span>⌄</span><span>⤢</span><span class="t">output</span></div>
  <div id="out"><pre id="o"><span class="ok">Press Run to generate a solution from your prompt.</span></pre></div>
 </div>
</div>
<script>
const $=id=>document.getElementById(id);
const p=$("prompt"),nums=$("nums"),o=$("o");
let ctrl=null,lastCode="";
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function updNums(){const n=Math.max(p.value.split("\n").length,24);nums.textContent=Array.from({length:n},(_,i)=>i+1).join("\n")}
p.addEventListener("input",updNums);
p.addEventListener("scroll",()=>{nums.scrollTop=p.scrollTop});
updNums();
function clean(t){return t.replace(/^\s*```[a-zA-Z+#]*\n?/,"").replace(/\n?```\s*$/,"")}
function msg(cls,t){o.innerHTML='<span class="'+cls+'">'+esc(t)+'</span>'}
async function run(){
  const text=p.value.trim();
  if(!text){msg("err","Please write a problem description in the editor first.");return}
  const lang=$("lang").value;
  ctrl=new AbortController();
  $("run").disabled=true;
  msg("ok","Generating solution...");
  try{
    const res=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:text,lang}),signal:ctrl.signal});
    const data=await res.json().catch(()=>({}));
    if(!res.ok)throw new Error(data.error||("Server error "+res.status));
    lastCode=clean(data.code||"");
    o.innerHTML=esc(lastCode)+'\n\n<span class="ok">...AI finished: solution generated</span>\n<span class="ok">Press ENTER to exit console.</span><span class="cur"></span>';
  }catch(e){
    if(e&&e.name==="AbortError"){msg("err","...Stopped")}
    else msg("err","Something went wrong: "+((e&&e.message)||"unknown error"));
  }finally{$("run").disabled=false;ctrl=null}
}
$("run").onclick=run;
$("stop").onclick=()=>{if(ctrl)ctrl.abort()};
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText(lastCode);$("copy").textContent="✓ Copied"}catch(e){$("copy").textContent="Select & copy manually"}setTimeout(()=>$("copy").textContent="⧉ Copy code",1500)};
</script>
</body>
</html>
